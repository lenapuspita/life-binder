<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Life Binder</title>
  <meta name="theme-color" content="#FBF7F4" />
  <meta name="description" content="Life Binder pribadi Lena" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>:root {
  --bg: #FBF7F4;
  --card: #FFFFFF;
  --ink: #3E3437;
  --ink-2: #8A7D80;
  --line: #EFE6E1;
  --rose: #C97C86;
  --rose-soft: #F6E3E5;
  --rose-deep: #A9606B;
  --late: #C5675F;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(120, 90, 90, .05), 0 4px 16px rgba(120, 90, 90, .06);
  --nav-h: 68px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.45; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.01em; }
h1 { font-size: 22px; }
h2 { font-size: 17px; }
h3 { font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
p { margin: 0 0 8px; }
.muted { color: var(--ink-2); }
.small { font-size: 13.5px; }
.center { text-align: center; }
.right { text-align: right; }
.late { color: var(--late); }
.red { color: #D45858 !important; }
.cuti { color: #DB8B3C !important; }
.loading { display: grid; place-items: center; min-height: 100vh; color: var(--ink-2); }

.page { max-width: 640px; margin: 0 auto; padding: 12px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom)); }
.demo-bar { background: #FFF2C2; color: #7C6420; text-align: center; font-size: 12.5px; padding: 4px 8px; }
.error-bar { background: #FBD7E3; color: #8C3550; text-align: center; font-size: 13.5px; padding: 8px 12px; }

/* ---------- Hari Ini ---------- */
.hero { padding: 10px 2px 14px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.hello { color: var(--rose-deep); font-weight: 700; margin: 0 0 2px; }
.hijri { color: var(--ink-2); font-size: 14px; margin: 2px 0 8px; }
.hero-icons { display: flex; gap: 2px; }
.pill { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 99px; margin: 0 6px 6px 0; }
.pill-soft { background: #F1ECE8; color: var(--ink-2); }
.done-note { margin: 10px 0 0; color: #4F9C74; font-weight: 700; font-size: 14px; }

.icon-btn { position: relative; display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; color: var(--ink); }
.icon-btn:active { background: var(--rose-soft); }
.icon-btn.small { width: 34px; height: 34px; }
.badge { position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--rose); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }

/* ---------- Kartu ---------- */
.card { display: block; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px; }
.card-tint { background: color-mix(in srgb, var(--tint) 45%, white); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; width: 100%; text-align: left; }
.card-link { display: flex; align-items: center; justify-content: space-between; font-weight: 700; color: var(--ink); }
.card-link span { display: inline-flex; gap: 8px; align-items: center; }
.link { color: var(--rose-deep); font-weight: 700; font-size: 14px; }
.note { background: var(--bg, #F4EEE8); background: color-mix(in srgb, var(--bg) 70%, white); border-radius: 14px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; color: var(--ink); }
.page-head + .note, .note { border: 1px dashed var(--line); }
.empty { text-align: center; color: var(--ink-2); padding: 36px 16px; }
.empty p { margin-top: 8px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex: none; }

.page-head { display: flex; align-items: center; gap: 6px; padding: 6px 0 14px; position: relative; }
.page-head::before { content: ''; position: absolute; inset: -12px -16px 4px; background: var(--head, transparent); opacity: .55; border-radius: 0 0 24px 24px; z-index: -1; }
.page-title { flex: 1; min-width: 0; }
.page-title p { margin: 0; }

/* ---------- Tugas ---------- */
.task { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.card-head + .task, .card > .task:first-child { border-top: 0; }
.check { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--c, var(--rose)); display: grid; place-items: center; color: #fff; margin-top: 1px; }
.task.done .check { background: var(--c, var(--rose)); }
.task.done .task-title { text-decoration: line-through; color: var(--ink-2); }
.task-main { flex: 1; min-width: 0; }
.task-title { font-weight: 700; word-break: break-word; }
.task-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 99px; background: #F1ECE8; color: var(--ink); }
.tag-pri { background: #FBD7E3; color: #8C3550; }
.star { flex: none; color: #D9CBC6; padding: 2px; }
.star.on { color: #E8B04A; }
.late-row { border-top: 1px solid var(--line); padding-bottom: 6px; }
.late-row .task { border-top: 0; }
.late-actions { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 38px; }

/* ---------- Chip & tombol ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 700; padding: 6px 13px; border-radius: 99px; background: #F4EEEA; color: var(--ink); white-space: nowrap; }
.chip.on { background: var(--rose); color: #fff; }
.chip.on .muted { color: #fff; opacity: .8; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; border-radius: 14px; padding: 12px 18px; min-height: 46px; }
.btn-sm { min-height: 38px; padding: 8px 14px; font-size: 14.5px; border-radius: 12px; }
.btn-block { width: 100%; margin-top: 10px; }
.btn-primary { background: var(--rose); color: #fff; }
.btn-primary:active { background: var(--rose-deep); }
.btn-soft { background: var(--rose-soft); color: var(--rose-deep); }
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost.danger { color: var(--late); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.row-btn { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0; border-top: 1px solid var(--line); }
.card-head + .row-btn, .card > .row-btn:first-child, h3 + .row-btn { border-top: 0; }
.row-btn.static { cursor: default; }
.as-btn { cursor: pointer; }
.plus { color: #3F9068; }
.minus { color: var(--ink); }
.tx-cat { font-weight: 700; }

/* ---------- Kalender ---------- */
.segmented { display: flex; background: #F1EAE6; border-radius: 14px; padding: 4px; margin-bottom: 12px; }
.segmented button { flex: 1; padding: 8px 6px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.segmented button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-title-btn { font-weight: 800; font-size: 16px; }
.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 8px; margin: 8px 0 12px; }
.mh { text-align: center; font-size: 12px; font-weight: 800; color: var(--ink-2); padding-bottom: 4px; }
.mh.sun { color: #D45858; }
.md { display: flex; flex-direction: column; align-items: center; padding: 5px 0 4px; border-radius: 12px; min-height: 56px; }
.md .num { font-weight: 800; font-size: 15px; line-height: 1.2; }
.md .hd { font-size: 10px; color: var(--ink-2); line-height: 1.1; }
.md .dots { display: flex; gap: 2px; margin-top: 3px; height: 6px; }
.md .dots i { width: 6px; height: 6px; border-radius: 50%; }
.md.red { background: #FCE9E9; }
.md.red .num { color: #D45858; }
.md.cuti { background: #FEF0E1; }
.md.cuti .num { color: #DB8B3C; }
.md.today { box-shadow: inset 0 0 0 2px var(--rose); }
.md.sel { background: var(--rose); }
.md.sel .num, .md.sel .hd { color: #fff; }
.cal-item { display: flex; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; margin-top: 6px; border-radius: 12px; background: color-mix(in srgb, var(--c) 18%, white); border-left: 4px solid var(--c); }
.cal-time { flex: none; width: 62px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.cal-title { font-weight: 700; font-size: 14.5px; }
.week-day.is-today { box-shadow: inset 0 0 0 2px var(--rose), var(--shadow); }
.week-day .card-head { margin-bottom: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); padding: 4px 4px 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* ---------- Keuangan ---------- */
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: color-mix(in srgb, var(--bg) 70%, white); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
.stat span { display: block; font-size: 13px; color: var(--ink-2); font-weight: 700; }
.stat b { font-size: 18px; }
.budget { padding: 8px 0; }
.budget-top { display: flex; justify-content: space-between; font-size: 14.5px; font-weight: 700; }
.bar { height: 8px; background: #F1EAE6; border-radius: 99px; overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.budget-input { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
.budget-input input { width: 50%; }

/* ---------- Konten ---------- */
.content-card { border-top: 1px solid var(--line); padding: 10px 0; cursor: pointer; }
.card-head + .content-card { border-top: 0; }
.content-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.content-card .chip { margin-top: 8px; background: var(--rose-soft); color: var(--rose-deep); }

/* ---------- Binder ---------- */
.area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.area { position: relative; display: flex; flex-direction: column; gap: 2px; background: var(--bg); border-radius: var(--radius); padding: 14px 14px 12px; min-height: 104px; overflow: hidden; }
.area::after { content: ''; position: absolute; right: 0; top: 14px; width: 6px; height: 34px; border-radius: 6px 0 0 6px; background: var(--dot); }
.area-icon { font-size: 24px; }
.area-name { font-weight: 800; font-size: 15px; line-height: 1.25; }
.area-sub { font-size: 12.5px; color: var(--ink-2); }

/* ---------- Kotak Masuk ---------- */
.inbox-add { display: flex; gap: 8px; margin-bottom: 14px; }
.inbox-add input { flex: 1; }
.inbox-add .btn { padding: 0 14px; }
.inbox-item p { font-weight: 700; white-space: pre-wrap; word-break: break-word; }
.inbox-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.inbox-actions .icon-btn { margin-left: auto; color: var(--ink-2); }

/* ---------- Formulir ---------- */
input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: #FDFBFA; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; min-height: 46px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--rose); background: #fff; }
input[type=color] { width: 46px; padding: 4px; flex: none; }
textarea { resize: vertical; }
.field { display: block; margin-bottom: 12px; }
.field-label { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 5px; }
.field-hint { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick-dates { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
.form-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
.form-actions .btn-primary { flex: 1; }
.capture { font-size: 17px; min-height: 76px; }
.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick { background: var(--bg); border-radius: 14px; padding: 12px 4px; font-weight: 800; font-size: 14px; }
.child-row { display: flex; gap: 10px; margin-bottom: 8px; }
.search-box { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 14px; padding: 0 12px; box-shadow: var(--shadow); margin-bottom: 12px; color: var(--ink-2); }
.search-box input { border: 0; background: transparent; }
.filter-row { margin-bottom: 12px; }
.steps { padding-left: 20px; }
.steps li { margin-bottom: 6px; }
.error { color: var(--late); margin-top: 12px; }

/* ---------- Sheet ---------- */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(62, 52, 55, .32); z-index: 40; animation: fade .2s ease; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 640px; margin: 0 auto; background: var(--bg); border-radius: 24px 24px 0 0; max-height: 92vh; display: flex; flex-direction: column; animation: up .22s ease; padding-bottom: env(safe-area-inset-bottom); }
.sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: #E2D6D2; margin: 8px auto 0; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px 4px 20px; }
.sheet-body { overflow-y: auto; padding: 8px 20px 24px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-weight: 700; font-size: 14px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center; animation: fade .2s ease; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Navigasi bawah ---------- */
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: center; background: rgba(255, 255, 255, .96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); }
.bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: var(--ink-2); padding: 6px 0; }
.bottom-nav a.on { color: var(--rose-deep); }
.fab { justify-self: center; width: 58px; height: 58px; border-radius: 50%; background: var(--rose); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(201, 124, 134, .45); transform: translateY(-14px); }
.fab:active { background: var(--rose-deep); }

/* ---------- Masuk ---------- */
.login { max-width: 380px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; text-align: center; }
.login-logo { font-size: 56px; }
.login h1 { font-size: 28px; margin: 8px 0 4px; }

@media (min-width: 700px) {
  .area-grid { grid-template-columns: repeat(3, 1fr); }
  .md { min-height: 68px; }
}

/* ---------- Tampilan buku binder ---------- */
.page-binder { padding-left: 6px; padding-right: 0; max-width: 720px; }
.binder { display: grid; grid-template-columns: minmax(0, 1fr) 46px; align-items: start; padding-left: 10px; }
.binder-sheet {
  position: relative; isolation: isolate; min-height: calc(100vh - var(--nav-h) - 40px);
  background: #FFFDFB; border-radius: 6px 4px 4px 6px;
  box-shadow: 0 1px 2px rgba(120, 90, 90, .08), 0 8px 24px rgba(120, 90, 90, .10), 3px 3px 0 #F3ECE7, 6px 6px 0 #EDE4DE;
  border-top: 8px solid var(--tab);
  padding: 14px 14px 22px 40px;
}
/* garis margin kertas */
.binder-sheet::before { content: ''; position: absolute; top: 0; bottom: 0; left: 30px; width: 1.5px; background: var(--tabdot); opacity: .28; z-index: 1; pointer-events: none; }
/* 3 ring binder + lubangnya */
.ring { position: absolute; left: -12px; width: 30px; height: 16px; z-index: 3; pointer-events: none; }
.ring::before { content: ''; position: absolute; right: 2px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: #E9DFD9; box-shadow: inset 1px 1px 2px rgba(90, 70, 70, .28); }
.ring::after { content: ''; position: absolute; left: 0; top: 4px; width: 24px; height: 8px; border-radius: 8px; background: linear-gradient(180deg, #F4F1F3, #C9C0C5 55%, #E3DDE1); box-shadow: 0 1px 2px rgba(80, 60, 60, .25); }
.ring.r1 { top: 64px; } .ring.r2 { top: 50%; } .ring.r3 { bottom: 64px; }
.binder-body { position: relative; z-index: 2; }
.binder-sheet .page-head::before { inset: -14px -14px 4px -40px; border-radius: 0; opacity: .5; background: var(--head, var(--tab)); }
.binder-sheet .card { box-shadow: none; border: 1px solid var(--line); }
.binder-sheet .card-tint { border-color: transparent; }

/* tab pembatas di sisi kanan */
.binder-tabs { position: sticky; top: 10px; display: flex; flex-direction: column; gap: 3px; padding-top: 14px; max-height: calc(100vh - var(--nav-h) - 24px); overflow-y: auto; scrollbar-width: none; }
.binder-tabs::-webkit-scrollbar { display: none; }
.btab {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 8px 0; margin-left: -2px;
  background: var(--b); border-radius: 0 12px 12px 0; box-shadow: 2px 1px 4px rgba(120, 90, 90, .10);
  border-left: 3px solid color-mix(in srgb, var(--d) 55%, transparent); transform: translateX(-4px); transition: transform .15s ease;
}
.btab-ic { font-size: 18px; line-height: 1; }
.btab-tx { display: none; font-size: 11.5px; font-weight: 800; color: var(--ink); writing-mode: vertical-rl; letter-spacing: .02em; }
.btab.on { transform: translateX(-10px); padding-left: 8px; margin-right: -6px; border-left: 0; box-shadow: 3px 2px 8px rgba(120, 90, 90, .16); background: color-mix(in srgb, var(--b) 80%, var(--d)); }

/* daftar isi */
.cover-title { text-align: center; padding: 10px 0 16px; border-bottom: 1px dashed var(--line); margin-bottom: 12px; }
.cover-kicker { font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--rose); margin: 0; }
.cover-title h1 { font-size: 30px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 600; color: var(--rose-deep); }
.toc-head { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-2); margin: 4px 0 6px; }
.toc { list-style: none; margin: 0 0 16px; padding: 0; }
.toc-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid #F3ECE8; }
.toc-no { width: 18px; font-size: 12px; color: var(--ink-2); font-weight: 700; text-align: right; }
.toc-ic { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--b); font-size: 15px; flex: none; }
.toc-name { font-weight: 700; font-size: 15px; }
.toc-dots { flex: 1; border-bottom: 2px dotted color-mix(in srgb, var(--d) 45%, transparent); transform: translateY(4px); min-width: 12px; }
.toc-sub { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.toc-tools .card { margin-bottom: 8px; }

@media (min-width: 700px) {
  .binder { grid-template-columns: minmax(0, 1fr) 54px; }
  .btab { padding: 7px 2px 7px 0; }
  .btab-tx { display: block; }
  .binder-sheet { padding-left: 48px; }
  .binder-sheet::before { left: 36px; }
  .binder-sheet .page-head::before { left: -48px; }
}
.btab-tx { margin-top: 3px; }
.btab-ic { display: block; height: 20px; }
.btab:not(.on) { filter: saturate(.85); }
.btab.on .btab-tx { color: var(--rose-deep); }
</style>
</head>
